server:
  port: 8084
  address: 0.0.0.0

spring:
  application:
    name: mekongsaltlab
  datasource:
    url: jdbc:mysql://localhost:3306/mekong
    username: root
    password: "1111"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: ${JWT_SECRET:mekong-secret-key-change-in-production-min-256-bits-long}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3004,http://localhost:3000}

s3:
  endpoint: https://backup.hci.vn
  bucket: c01-mekong-prod-01
  access-key: ${S3_ACCESS_KEY:dummy-access-key}
  secret-key: ${S3_SECRET_KEY:dummy-secret-key}
  region: us-east-1
  max-file-size: 104857600 # 100MB