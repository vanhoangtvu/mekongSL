server:
  port: 8084
  address: 0.0.0.0

spring:
  application:
    name: mekongsaltlab
  datasource:
    url: jdbc:mysql://localhost:3306/mekong
    username: root
    password: "1111"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:mekong-secret-key-change-in-production-min-256-bits-long}
  expiration: 86400000